# Production Nginx: the only public entry point. Routes /api to Express and
# everything else to the Next.js server, on one origin (architecture D13).

upstream fitgeng_api {
  server backend:4000;
  keepalive 16;
}

upstream fitgeng_web {
  server frontend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 6m; # uploads are capped at 5 MB by the API

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-Id $request_id;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Express API.
  location /api/ {
    proxy_pass http://fitgeng_api;
    proxy_read_timeout 30s;
  }

  # Hashed Next.js build assets: immutable, cached for a year.
  location /_next/static/ {
    proxy_pass http://fitgeng_web;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Everything else is rendered (or served from the ISR cache) by Next.js, which sets its own Cache-Control.
  location / {
    proxy_pass http://fitgeng_web;
    proxy_read_timeout 60s;
  }
}
